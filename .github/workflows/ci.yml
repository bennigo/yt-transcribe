name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # `uv sync` deliberately does NOT install the optional [gpu] extra, so CI
      # never downloads the ~2 GB CUDA wheels. Tests fake every external call.
      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  # Guard against the README drifting away from the code.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the README documents every CLI flag
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          cli = pathlib.Path("src/yt_transcribe/cli.py").read_text()
          readme = pathlib.Path("README.md").read_text()
          flags = {
              m for m in re.findall(r'"(--[a-z-]+)"', cli)
              if not m.startswith("--no-") or m == "--no-timestamps"
          }
          # --output/--format/--model/--language appear as short+long pairs in docs
          missing = sorted(f for f in flags if f not in readme)
          if missing:
              print("Undocumented CLI flags:", ", ".join(missing))
              sys.exit(1)
          print(f"All {len(flags)} CLI flags are documented.")
          PY
